<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignForest</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>SignForest</h1>
      <p>LIBRAS → texto</p>
    </header>

    <section class="camera">
      <video id="video" autoplay playsinline muted></video>
    </section>

    <section class="buttons">
      <button id="startCamera">Iniciar câmera</button>
      <button id="stopCamera" disabled>Parar</button>
    </section>

    <div id="status">Câmera parada</div>

    <section class="result">
      <small>Sinal detectado</small>
      <strong id="recognizedText">—</strong>
      <span id="confidence">Confiança: —</span>
      <div class="stability-track">
        <div id="stabilityFill" class="stability-fill"></div>
      </div>
    </section>

    <section class="typed">
      <small>Texto digitado nesta sessão</small>
      <strong id="typedPreview">—</strong>
    </section>

    <section class="single-button">
      <button id="togglePause" disabled>Pausar soletração</button>
    </section>

    <section class="buttons">
      <button id="sendSpace" disabled>Espaço</button>
      <button id="sendBackspace" disabled>Apagar</button>
    </section>
    <section class="single-button">
      <button id="clearTyped" disabled>Limpar texto digitado</button>
    </section>

    <details>
      <summary>Diagnóstico</summary>
      <pre id="diagnostics"></pre>
    </details>
  </main>

  <!-- ort.min.js expõe window.ort (script clássico); os assets do MediaPipe são
       carregados como módulo ES diretamente por sidepanel.js. Nenhum dos dois
       depende de CDN — todos os arquivos ficam em assets/. -->
  <script src="assets/onnx/ort.min.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
