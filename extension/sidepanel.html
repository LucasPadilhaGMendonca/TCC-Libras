<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVL Libras</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-icon">🤟</div>
        <div>
          <h1 class="title">RVL Libras</h1>
          <p class="subtitle">Tradução de Datilologia em Tempo Real</p>
        </div>
      </div>
      <span id="statusBadge" class="badge status-standby">Inativo</span>
    </header>

    <!-- Área de Vídeo -->
    <div class="video-card">
      <div class="video-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        <div id="cameraPlaceholder" class="placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <p>Câmera pausada</p>
          <span class="subtext">Clique em "Iniciar Câmera" para começar</span>
        </div>
      </div>
      
      <!-- Controles -->
      <div class="controls-row">
        <button id="btnStart" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Iniciar Câmera
        </button>
        <button id="btnStop" class="btn btn-danger" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12"></rect>
          </svg>
          Parar
        </button>
      </div>

      <!-- Banner de Permissão (caso ocorra bloqueio) -->
      <div id="permissionNotice" class="permission-banner hidden">
        <p>⚠️ <strong>Permissão necessária:</strong> O Chrome precisa que você autorize a câmera na página de permissões.</p>
        <button id="btnOpenPermission" class="btn btn-secondary btn-sm">Liberar Acesso à Câmera</button>
      </div>
    </div>

    <!-- Resultados -->
    <section class="results-card">
      <div class="result-header">
        <span class="label-text">Sinal Reconhecido</span>
        <span id="fpsCounter" class="fps-tag">0 FPS</span>
      </div>

      <div class="prediction-box">
        <span id="predictedLetter" class="predicted-char">—</span>
      </div>

      <!-- Barra de Confiança -->
      <div class="confidence-container">
        <div class="confidence-header">
          <span>Grau de Certeza</span>
          <span id="confidenceValue">0%</span>
        </div>
        <div class="progress-track">
          <div id="confidenceBar" class="progress-fill" style="width: 0%;"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
